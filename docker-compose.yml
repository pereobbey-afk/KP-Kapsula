# Развёртывание «ИИ Сметчика».
#
# Два процесса из одного образа:
#   web    — принимает запросы, создаёт задачи, отдаёт статус и смету;
#   worker — выполняет анализ вне жизненного цикла HTTP-запроса.
#
# Оба процесса делят том с базой и загруженными файлами.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: '${PUBLIC_URL:?укажите публичный адрес}'
      SESSION_SECRET: '${SESSION_SECRET:?сгенерируйте: openssl rand -hex 32}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:?ключ доступа к ИИ API}'
      EXTRACTION_MODEL: '${EXTRACTION_MODEL:-claude-opus-5}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      MAX_FILE_BYTES: '${MAX_FILE_BYTES:-67108864}'
    volumes:
      - data:/data
      - storage:/storage
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker/main.js']
    environment:
      NODE_ENV: production
      SESSION_SECRET: '${SESSION_SECRET:?сгенерируйте: openssl rand -hex 32}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:?ключ доступа к ИИ API}'
      EXTRACTION_MODEL: '${EXTRACTION_MODEL:-claude-opus-5}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      WORKER_CONCURRENCY: '${WORKER_CONCURRENCY:-2}'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-120}'
      JOB_TIMEOUT_SECONDS: '${JOB_TIMEOUT_SECONDS:-1800}'
    volumes:
      - data:/data
      - storage:/storage
    depends_on:
      - web
    # Воркеров можно поднять несколько: аренда задач не даст им
    # взять одну и ту же задачу дважды.
    # deploy:
    #   replicas: 2

volumes:
  data:
  storage:
